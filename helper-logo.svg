<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0e"/>
      <stop offset="100%" style="stop-color:#111116"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="248" height="248" rx="32" ry="32" fill="url(#bg)" stroke="#00f7ff" stroke-width="1.5" opacity="0.9"/>

  <!-- Shield -->
  <polygon points="128,30 200,65 200,145 128,220 56,145 56,65"
           fill="#0a1a1a" stroke="#00f7ff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner shield glow ring -->
  <polygon points="128,48 184,76 184,140 128,200 72,140 72,76"
           fill="none" stroke="#00f7ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Terminal prompt '>' -->
  <text x="86" y="150" font-family="'Fira Code', 'Courier New', monospace"
        font-size="72" font-weight="bold" fill="#00f7ff" filter="url(#glow)">&gt;</text>

  <!-- Cursor '_' in purple -->
  <text x="148" y="163" font-family="'Fira Code', 'Courier New', monospace"
        font-size="38" font-weight="bold" fill="#bc13fe" filter="url(#glow)">_</text>

  <!-- Label -->
  <text x="128" y="242" font-family="'Fira Code', 'Courier New', monospace"
        font-size="0" fill="#00f7ff" text-anchor="middle" opacity="0"/>
</svg>
